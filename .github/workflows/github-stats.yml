name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # 每天半夜自動執行
  workflow_dispatch: {} # 允許手動觸發

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=tsz7250&rank_icon=github&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }} # 在此處使用您設定的 Personal Access Token 才能獲取 private commit

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=tsz7250&layout=compact&theme=radical&hide_border=true&bg_color=0D1117&include_all_commits=true&exclude_repo=1122_HDL,1122_AssemblyLanguage
          path: profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub readme stats" || echo "No changes to commit"
          git push
